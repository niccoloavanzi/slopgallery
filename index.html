        body {
            background-color: #050505;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* Evita scroll della pagina principale */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Supporto per l'altezza dinamica sui browser mobili */
            height: 100dvh; 
        }

        /* Phone Frame Simulation (iPhone Style) - Solo Desktop */
        .phone-mockup {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .phone-mockup {
                width: 390px; /* iPhone 14/15 width approx */
                height: 844px;
                border-radius: 50px; /* iPhone rounded corners */
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
                border: 12px solid #222; /* Bezel */
            }
        }

        /* Header Alignment */
        .dynamic-island-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: 12px;
            position: relative;
            z-index: 60;
        }

        /* Dynamic Island (The "SLOP" container) */
        .dynamic-island {
            background-color: #000;
            width: 126px; /* Slightly wider to fit text perfectly */
            height: 36px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 8px;
            box-shadow: 0 0 2px rgba(255,255,255,0.1);
            z-index: 100;
            border: 1px solid #1a1a1a;
            cursor: pointer;
            overflow: hidden; /* Ensures text doesn't spill out during animation */
            position: relative; /* Context for absolute text movement if needed, though we use transform */
        }
        
        .dynamic-island:active {
            transform: scale(0.95); /* Slight press effect */
        }

        /* Text inside Dynamic Island */
        #slop-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 900; /* Extra bold */
            font-size: 1.1rem; /* Larger font */
            letter-spacing: 0.15em; /* Spaced out to fill */
            color: white;
            user-select: none;
            padding-left: 0.15em; /* Optical centering due to letter-spacing */
            display: inline-block; /* Essential for transform */
            will-change: transform, filter; /* Optimize rendering */
        }

        .header-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            flex: 1;
        }

        /* Notification Area */
        #notification-area {
            position: absolute;
            top: 60px; /* Just below Dynamic Island */
            left: 0;
            width: 100%;
            padding: 0 10px;
            z-index: 80;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            /* Limita l'altezza per fermarsi prima dei pulsanti in basso */
            max-height: calc(100% - 280px); 
            overflow: hidden; /* Nasconde le notifiche che vanno oltre */
        }

        /* Push Notification Style - CLEAN VERSION */
        .push-notification {
            background: rgba(22, 22, 22, 0.95); /* Più solido per evitare effetto "sporco" */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08); /* Bordo molto più sottile e pulito */
            color: white;
            width: 96%;
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            /* Ombra molto più pulita e definita, senza alone diffuso */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); 
            transform: translateY(-50px) scale(0.95);
            opacity: 0;
            animation: notifIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: all;
            position: relative;
            flex-shrink: 0; /* Impedisce che si schiaccino */
        }

        @keyframes notifIn {
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        @keyframes notifOut {
            to { transform: translateY(-20px) scale(0.9); opacity: 0; }
        }

        /* Scroll Snap Container */
        .feed-container {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Single Item Styling */
        .feed-item {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feed-item img, .feed-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlays */
        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            pointer-events: none;
            z-index: 20;
        }
        
        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.5) 60%, transparent 100%);
            pointer-events: none;
            z-index: 20;
        }

        /* Info Overlay */
        .item-info {
            position: absolute;
            bottom: 110px;
            left: 15px;
            z-index: 30;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            width: 75%;
        }

        /* Side Actions */
        .side-actions {
            position: absolute;
            bottom: 110px;
            right: 10px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .action-btn:active {
            transform: scale(0.9);
        }

        /* Search Overlay */
        #search-overlay {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            z-index: 50;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            transform: translateY(-150%);
            transition: transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #search-overlay.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        /* Share Modal */
        #share-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e1e1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        #share-modal.active {
            transform: translateY(0);
        }
        #share-overlay-bg {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 190;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #share-overlay-bg.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Funny Message Modal */
        #message-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(20,20,20, 0.95);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
        }
        #message-modal.active {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }
    
        /* Viewer Modal (audio ON) */

            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 240;
            opacity: 0;
            pointer-events: none;

            pointer-events: all;

            inset: 0;
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);

            right: 12px;

            align-items: center;
            justify-content: space-between;
            color: white;
            z-index: 260;
        }

            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

        // ==========================================
        // DYNAMIC ISLAND INTERACTION (ACCELERATING SCROLL)
        // ==========================================
        let animationId = null;
        
        function triggerIslandAnimation() {
            const text = document.getElementById('slop-text');
            if (animationId) return; // Prevent double trigger

            let startTime = performance.now();
            let duration = 5000; // 5 seconds
            let position = 0; 
            
            // Limit boundaries for wrap around
            // Container ~126px, text ~60px. 
            // We wrap when text is fully out to the right (~80px) and reset to left (-80px)
            const limit = 90;

            function animate(currentTime) {
                let elapsed = currentTime - startTime;
                
                // End condition
                if (elapsed >= duration) {
                    text.style.transform = 'translateX(0)';
                    text.style.filter = 'blur(0)';
                    animationId = null;
                    return;
                }

                // Acceleration logic: Speed factor from 0 to 1
                let progress = elapsed / duration; 
                
                // Quadratic acceleration: Speed increases significantly
                // Base speed 3, max added speed 45
                let speed = 3 + (45 * (progress * progress)); 

                position += speed;

                // Wrap around logic
                if (position > limit) {
                    position = -limit;
                }

                // Blur effect based on speed
                // Max blur around 4px at top speed
                let blurAmount = (speed / 50) * 4; 

                text.style.transform = `translateX(${position}px)`;
                text.style.filter = `blur(${blurAmount}px)`;
                
                animationId = requestAnimationFrame(animate);
            }

            animationId = requestAnimationFrame(animate);
        }

        function renderFeed(data) {
            feedContainer.innerHTML = '';
            
            if(data.length === 0) {
                feedContainer.innerHTML = `
                    <div class="flex h-full w-full items-center justify-center flex-col text-gray-500">
                        <i class="fas fa-search text-4xl mb-4"></i>
                        <p>No slop found.</p>
                        <button onclick="clearSearch()" class="mt-4 text-blue-500 underline">Show all</button>
                    </div>`;
                return;
            }

            data.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'feed-item';
                
                // Tap on item => open viewer with audio (user gesture)
                el.addEventListener('click', () => openViewer(index));
                
                let mediaContent = '';
                if (item.type === 'image') {
                    mediaContent = `<img src="${item.src}" loading="lazy" alt="Content">`;
                } else if (item.type === 'video') {
                    mediaContent = `<video src=\"${item.src}\" loop muted playsinline preload=\"metadata\" poster=\"${item.thumb || ''}\"></video>`;
                }

                el.innerHTML = `
                    ${mediaContent}
                    <div class="overlay-top"></div>
                    <div class="overlay-bottom"></div>
                    
                    <div class="item-info">
                        ${item.username ? `<h3 class="font-bold text-sm mb-1 text-shadow">${item.username}</h3>` : ''}
                        <p class="text-sm leading-tight opacity-90 text-shadow">${item.caption}</p>
                    </div>

                    <div class="side-actions">
                         <div class="action-btn hover:text-red-500 transition-colors" onclick="event.stopPropagation(); toggleLike(this)">
                            <i class="fas fa-heart text-2xl drop-shadow-md"></i>
                            <span class="text-xs font-bold mt-1">${item.likes}</span>
                        </div>
                        <!-- Comment button removed as requested -->
                        <div class="action-btn" onclick="event.stopPropagation(); openShare(${index})">
                            <i class="fas fa-share text-2xl drop-shadow-md"></i>
                            <span class="text-xs font-bold mt-1">Share</span>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(el);
            });

            setupVideoAutoplay();
        }

        function setupVideoAutoplay() {
            const videos = document.querySelectorAll('video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(e => console.log("Autoplay blocked:", e));
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.6 });

            videos.forEach(video => observer.observe(video));
        }

        function openShare(index) {
            currentShareItem = currentData[index];
            document.getElementById('share-modal').classList.add('active');
            document.getElementById('share-overlay-bg').classList.add('active');
            document.getElementById('share-feedback').style.opacity = '0';
        }

        function closeShare() {
            document.getElementById('share-modal').classList.remove('active');
            document.getElementById('share-overlay-bg').classList.remove('active');
        }



        // ==========================================
        // VIEWER MODAL (AUDIO ON)
        // ==========================================

        function getActiveFeedVideo() {
            const items = document.querySelectorAll('.feed-item');
            if (!items || items.length === 0) return null;

            let bestItem = null;
            let bestDist = Infinity;

            items.forEach(it => {
                const r = it.getBoundingClientRect();
                const dist = Math.abs(r.top);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestItem = it;
                }
            });

            return bestItem ? bestItem.querySelector('video') : null;
        }

        function openViewer(index) {
            // if share modal is open, ignore
            const shareActive = document.getElementById('share-modal').classList.contains('active');
            if (shareActive) return;

            currentViewItem = currentData[index];
            if (!currentViewItem) return;

            const modal = document.getElementById('viewer-modal');
            const bg = document.getElementById('viewer-overlay-bg');
            const container = document.getElementById('viewer-content');

            // Pause the currently visible feed video for performance
            const activeFeedVideo = getActiveFeedVideo();
            if (activeFeedVideo) activeFeedVideo.pause();

            container.innerHTML = '';

            if (currentViewItem.type === 'video') {
                const v = document.createElement('video');
                v.src = currentViewItem.src;
                v.controls = true;
                v.autoplay = true;
                v.playsInline = true;
                v.loop = true;
                v.muted = false;            // ✅ AUDIO ON here
                v.preload = 'metadata';
                if (currentViewItem.thumb) v.poster = currentViewItem.thumb;

                v.style.maxWidth = '100%';
                v.style.maxHeight = '80vh';
                v.style.borderRadius = '16px';

                container.appendChild(v);

                // Try to play immediately (allowed due to click)
                v.play().catch(() => {});
            } else {
                const img = document.createElement('img');
                img.src = currentViewItem.src;
                img.style.maxWidth = '100%';
                img.style.maxHeight = '80vh';
                img.style.borderRadius = '16px';
                container.appendChild(img);
            }

            modal.classList.add('active');
            bg.classList.add('active');
        }

        function closeViewer() {
            const modal = document.getElementById('viewer-modal');
            const bg = document.getElementById('viewer-overlay-bg');
            const container = document.getElementById('viewer-content');

            const v = container.querySelector('video');
            if (v) {
                v.pause();
                v.src = '';
                v.load();
            }

            container.innerHTML = '';
            modal.classList.remove('active');
            bg.classList.remove('active');

            // Resume visible feed video (muted autoplay)
            const activeFeedVideo = getActiveFeedVideo();
            if (activeFeedVideo) {
                activeFeedVideo.play().catch(() => {});
            }
        }

        // ESC closes viewer (desktop)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeViewer();
        });

            if (navigator.share && currentShareItem) {
                try {
                    await navigator.share({
                        title: 'Slop Gallery',
                        text: currentShareItem.caption,
                        url: currentShareItem.src
                    });
                    closeShare();
                } catch (err) {
                    console.log('Share canceled');
                }
            } else {
                copyLink(); 
            }
        }

        function copyLink() {
            if(currentShareItem) {
                navigator.clipboard.writeText(currentShareItem.src);
                const feedback = document.getElementById('share-feedback');
                feedback.innerText = "Link copied to clipboard!";
                feedback.style.opacity = '1';
                setTimeout(closeShare, 1500);
            }
        }

        function downloadContent() {
            if(!currentShareItem) return;
            const link = document.createElement('a');
            link.href = currentShareItem.src;
            link.download = `slop-content-${Date.now()}.${currentShareItem.type === 'video' ? 'mp4' : 'jpg'}`;
            link.target = "_blank"; 
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            const feedback = document.getElementById('share-feedback');
            feedback.innerText = "Downloading...";
            feedback.style.opacity = '1';
            setTimeout(closeShare, 1500);
        }

            document.getElementById('search-input').value = '';

            renderFeed(currentData);

        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if(val === '') {
                currentData = [...fullLibrary];
            } else {
                currentData = fullLibrary.filter(item => {
                    const captionMatch = item.caption ? String(item.caption).toLowerCase().includes(val) : false;
                    const userMatch = item.username ? String(item.username).toLowerCase().includes(val) : false;
                    return captionMatch || userMatch;
                });
            }
            renderFeed(currentData);
        });
